name: Issue 19 tscircuit native bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tscircuit-native-spike.yml"
      - "hardware/tscircuit/package.json"
      - "hardware/tscircuit/package-lock.json"
      - "hardware/tscircuit/src/**"
      - "hardware/tscircuit/scripts/**"
      - "hardware/tscircuit/tests/**"
      - "docs/tscircuit-native-spike-report.md"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/tscircuit
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hardware/tscircuit/package-lock.json

      - name: Set up Bun 1.2.22
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Create evidence directory
        run: mkdir -p tscircuit-native-bootstrap

      - name: Verify package-lock SHA-256
        run: |
          set -o pipefail
          test -f package-lock.json
          sha256sum package-lock.json | tee tscircuit-native-bootstrap/package-lock.sha256
          printf '%s  %s\n' \
            'a6bd33cc9d0cfdd6f9f60fa343bf413fae4de33b62a8f4c26141857763cf9d33' \
            'package-lock.json' \
            | sha256sum --check \
            | tee tscircuit-native-bootstrap/package-lock-sha256-verification.txt

      - name: Install locked dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee tscircuit-native-bootstrap/npm-ci.txt

      - name: Verify package-lock remains unchanged
        run: |
          set -o pipefail
          git diff --exit-code -- package-lock.json 2>&1 \
            | tee tscircuit-native-bootstrap/package-lock-diff.txt

      - name: Verify Bun version
        run: |
          set -o pipefail
          bun --version | tee tscircuit-native-bootstrap/bun-version.txt
          test "$(cat tscircuit-native-bootstrap/bun-version.txt)" = "1.2.22"

      - name: Verify tscircuit CLI version
        run: |
          set -o pipefail
          ./node_modules/.bin/tsci --version \
            | tee tscircuit-native-bootstrap/tsci-version.txt
          test "$(cat tscircuit-native-bootstrap/tsci-version.txt)" = "0.0.2646"

      - name: Verify pinned package versions
        run: |
          set -o pipefail
          node -e 'for (const [name, expected] of Object.entries({"tscircuit":"0.0.2646","@tscircuit/core":"0.0.1971","@tscircuit/props":"0.0.666","circuit-json":"0.0.499","@tscircuit/cli":"0.1.2170"})) { const actual=require(`./node_modules/${name}/package.json`).version; console.log(`${name} ${actual}`); if (actual !== expected) process.exitCode=1 }' \
            | tee tscircuit-native-bootstrap/runtime-versions.txt

      - name: Execute and verify native Hall Checkpoint A
        run: |
          set -o pipefail
          npm run checkpoint-a:verify 2>&1 \
            | tee tscircuit-native-checkpoint-a-console.txt
          mv tscircuit-native-checkpoint-a-console.txt \
            tscircuit-native-checkpoint-a/execution-log.txt

      - name: Execute and verify native Hall Checkpoint B
        run: |
          set -o pipefail
          npm run checkpoint-b:verify 2>&1 \
            | tee tscircuit-native-checkpoint-b-console.txt
          mv tscircuit-native-checkpoint-b-console.txt \
            tscircuit-native-checkpoint-b/execution-log.txt

      - name: Verify native M1 four-key electrical model
        run: npm run m1:verify

      - name: Generate native Hall Checkpoint C Circuit JSON
        run: npm run checkpoint-c:generate

      - name: Run stock build and DRC checks
        run: |
          set -o pipefail
          ./node_modules/.bin/tsci build \
            src/spikes/native-hall/checkpoint-c.tsx \
            --disable-parts-engine 2>&1 \
            | tee tscircuit-native-checkpoint-c/drc-or-check-report.txt

      - name: Run supplemental stock checks
        run: |
          set -o pipefail
          ./node_modules/.bin/tsci check \
            "$PWD/tscircuit-native-checkpoint-c/circuit.json" 2>&1 \
            | tee tscircuit-native-checkpoint-c/supplemental-check-report.txt
          set +e
          ./node_modules/.bin/tsci check shorts \
            "$PWD/tscircuit-native-checkpoint-c/circuit.json" \
            --mode gerber --layer all 2>&1 \
            | tee tscircuit-native-checkpoint-c/shorts-check-report.txt
          shorts_status=${PIPESTATUS[0]}
          printf 'shorts exit=%s\n' "$shorts_status" \
            >> tscircuit-native-checkpoint-c/shorts-check-report.txt
          exit 0

      - name: Export stock manufacturing package
        run: |
          ./node_modules/.bin/tsci export \
            "$PWD/tscircuit-native-checkpoint-c/circuit.json" \
            --format gerbers \
            --output "$PWD/tscircuit-native-checkpoint-c/manufacturing.zip"
          mkdir -p tscircuit-native-checkpoint-c/manufacturing
          unzip -q tscircuit-native-checkpoint-c/manufacturing.zip \
            -d tscircuit-native-checkpoint-c/manufacturing

      - name: Verify Checkpoint C manufacturing artifacts
        run: npm run checkpoint-c:verify

      - name: Collect dependency diagnostics
        if: always()
        run: |
          set +e
          npm ls --all --json \
            > tscircuit-native-bootstrap/dependency-tree.json \
            2> tscircuit-native-bootstrap/dependency-tree.stderr.txt
          status=$?
          printf '%s\n' "$status" \
            | tee tscircuit-native-bootstrap/npm-ls-exit-code.txt
          exit 0

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-tscircuit-native-bootstrap
          path: hardware/tscircuit/tscircuit-native-bootstrap/
          if-no-files-found: warn

      - name: Upload M1 electrical-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-26-m1-electrical-model
          path: hardware/tscircuit/tscircuit-m1-electrical/
          if-no-files-found: error

      - name: Upload Checkpoint A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-tscircuit-native-checkpoint-a
          path: hardware/tscircuit/tscircuit-native-checkpoint-a/
          if-no-files-found: warn

      - name: Upload Checkpoint B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-tscircuit-native-checkpoint-b
          path: hardware/tscircuit/tscircuit-native-checkpoint-b/
          if-no-files-found: warn

      - name: Upload Checkpoint C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-tscircuit-native-checkpoint-c
          path: hardware/tscircuit/tscircuit-native-checkpoint-c/
          if-no-files-found: error
