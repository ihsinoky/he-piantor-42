name: engineering-ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: engineering-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect engineering changes
    runs-on: ubuntu-latest
    outputs:
      layout: ${{ steps.paths.outputs.layout }}
      kicad: ${{ steps.paths.outputs.kicad }}
      firmware: ${{ steps.paths.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_CURRENT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Default to running every engineering check. If either comparison
          # commit is unavailable (for example, on an initial push), this is
          # the safe result to publish.
          layout=true
          kicad=true
          firmware=true

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_CURRENT_SHA"
          else
            base_sha=""
            head_sha=""
          fi

          zero_sha=0000000000000000000000000000000000000000
          if [ -n "$base_sha" ] && [ -n "$head_sha" ] && [ "$base_sha" != "$zero_sha" ] &&
             git cat-file -e "${base_sha}^{commit}" 2>/dev/null &&
             git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            changed_paths="$(mktemp)"
            if git diff --name-only -z "$base_sha" "$head_sha" > "$changed_paths"; then
              layout=false
              kicad=false
              firmware=false

              while IFS= read -r -d '' path; do
                case "$path" in
                  hardware/layout/*)
                    layout=true
                    ;;
                  hardware/sensor-test/kicad/*|hardware/main/*|hardware/lib/*)
                    kicad=true
                    ;;
                  firmware/sensor-test/*)
                    firmware=true
                    ;;
                  .github/workflows/engineering-ci.yml)
                    layout=true
                    kicad=true
                    firmware=true
                    ;;
                esac
              done < "$changed_paths"
            else
              echo "Unable to calculate the diff; running all engineering jobs."
            fi
            rm -f "$changed_paths"
          else
            echo "Unable to establish a safe diff; running all engineering jobs."
          fi

          {
            echo "layout=$layout"
            echo "kicad=$kicad"
            echo "firmware=$firmware"
          } >> "$GITHUB_OUTPUT"

  layout:
    name: Layout generator
    needs: changes
    if: ${{ needs.changes.outputs.layout == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate 42-key layout
        run: |
          python3 hardware/layout/generate_layout.py
          git diff --exit-code -- hardware/layout/key_positions.csv hardware/layout/layout_preview.svg

  kicad:
    name: KiCad ERC / DRC
    needs: changes
    if: ${{ needs.changes.outputs.kicad == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull official KiCad CLI image
        run: docker pull kicad/kicad:9.0.9
      - name: Run ERC and DRC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          chmod 777 ci-reports
          found=0
          violations=0

          while IFS= read -r -d '' sch; do
            found=1
            base="$(basename "$sch" .kicad_sch)"
            echo "::group::ERC $sch"
            docker run --rm -v "$PWD:/work" -w /work kicad/kicad:9.0.9 \
              kicad-cli sch erc --severity-error --exit-code-violations \
              --output "ci-reports/${base}-erc.rpt" "$sch" || violations=1
            echo "::endgroup::"
          done < <(find hardware/sensor-test hardware/main -type f -name '*.kicad_sch' -print0 2>/dev/null)

          while IFS= read -r -d '' pcb; do
            found=1
            base="$(basename "$pcb" .kicad_pcb)"
            echo "::group::DRC $pcb"
            docker run --rm -v "$PWD:/work" -w /work kicad/kicad:9.0.9 \
              kicad-cli pcb drc --severity-error --exit-code-violations \
              --output "ci-reports/${base}-drc.rpt" "$pcb" || violations=1
            echo "::endgroup::"
          done < <(find hardware/sensor-test hardware/main -type f -name '*.kicad_pcb' -print0 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "No project KiCad files yet; reference designs under hardware/lib are intentionally skipped."
          fi

          exit "$violations"

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: ci-reports/
          if-no-files-found: ignore

  firmware:
    name: Sensor-test firmware
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RP2040 ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib

      - name: Checkout Pico SDK 2.3.1
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: .pico-sdk
          submodules: recursive

      - name: Configure sensor-test firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/.pico-sdk
        run: |
          cmake -S firmware/sensor-test -B build/sensor-test \
            -G Ninja \
            -DPICO_BOARD=pico

      - name: Build sensor-test firmware
        run: cmake --build build/sensor-test

      - name: Upload sensor-test firmware
        uses: actions/upload-artifact@v4
        with:
          name: sensor-test-firmware
          path: |
            build/sensor-test/sensor_test.uf2
            build/sensor-test/sensor_test.elf

  engineering-gate:
    name: Engineering gate
    needs: [changes, layout, kicad, firmware]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify engineering jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LAYOUT_RESULT: ${{ needs.layout.result }}
          KICAD_RESULT: ${{ needs.kicad.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          for result in "$CHANGES_RESULT" "$LAYOUT_RESULT" "$KICAD_RESULT" "$FIRMWARE_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "An engineering CI dependency ended with result: $result"
              exit 1
            fi
          done
