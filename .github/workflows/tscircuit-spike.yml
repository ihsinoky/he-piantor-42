name: tscircuit spike bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap locked tscircuit toolchain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/tscircuit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Bun 1.2.22
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Verify committed dependency lockfile
        run: |
          set -euo pipefail
          mkdir -p bootstrap-evidence
          test -f package-lock.json
          sha256sum package-lock.json \
            | tee bootstrap-evidence/package-lock.sha256
          printf '%s  %s\n' \
            'a6bd33cc9d0cfdd6f9f60fa343bf413fae4de33b62a8f4c26141857763cf9d33' \
            'package-lock.json' \
            | sha256sum --check \
            | tee bootstrap-evidence/package-lock-sha256-verification.txt

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee bootstrap-evidence/npm-ci.txt

      - name: Verify dependency lockfile is unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json 2>&1 \
            | tee bootstrap-evidence/package-lock-diff.txt

      - name: Record Bun version
        run: |
          set -euo pipefail
          bun --version 2>&1 | tee bootstrap-evidence/bun-version.txt
          grep -Fx '1.2.22' bootstrap-evidence/bun-version.txt

      - name: Record tscircuit CLI version
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsci --version 2>&1 \
            | tee bootstrap-evidence/tsci-version.txt
          grep -Fx '0.0.2646' bootstrap-evidence/tsci-version.txt

      - name: Record dependency tree and peer diagnostics
        run: |
          set -uo pipefail
          set +e
          npm ls --all --json \
            > bootstrap-evidence/dependency-tree.json \
            2> bootstrap-evidence/dependency-tree.stderr.txt
          npm_ls_exit_code=$?
          set -e
          printf '%s\n' "$npm_ls_exit_code" \
            | tee bootstrap-evidence/npm-ls-exit-code.txt
          # npm ls reports ELSPROBLEMS for the currently resolved peer graph.
          # Preserve that result as evidence without masking it or failing this
          # runtime-bootstrap checkpoint solely because of dependency metadata.
          exit 0

      - name: Convert and verify authoritative Hall footprint
        run: |
          set -euo pipefail
          mkdir -p footprint-evidence
          npm run footprint:verify 2> >(tee footprint-evidence/converter-stderr.txt >&2) \
            | tee footprint-evidence/geometry-verification-report.txt

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-13-tscircuit-bootstrap
          path: |
            hardware/tscircuit/package-lock.json
            hardware/tscircuit/bootstrap-evidence/
            hardware/tscircuit/footprint-evidence/
          if-no-files-found: warn

      - name: Evaluate Hall footprint integrity gate
        if: always()
        run: |
          set -euo pipefail
          result=footprint-evidence/verification-result.json
          if [ ! -f "$result" ]; then
            echo 'VERIFIER / CONVERTER EXECUTION FAILURE: verification-result.json is missing' >&2
            exit 1
          fi
          node - <<'NODE'
          const result = require("./footprint-evidence/verification-result.json")
          if (result.stop1 === true) {
            console.error("STOP 1 — FOOTPRINT INTEGRITY")
            process.exit(1)
          }
          if (result.stop1 !== false) {
            console.error("VERIFIER / CONVERTER EXECUTION FAILURE: invalid stop1 result")
            process.exit(1)
          }
          console.log("PASS — Hall footprint integrity")
          NODE
