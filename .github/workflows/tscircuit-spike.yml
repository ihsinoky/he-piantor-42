name: tscircuit spike bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap locked tscircuit toolchain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/tscircuit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Bun 1.2.22
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Check npm registry accessibility
        run: |
          set -euo pipefail
          mkdir -p bootstrap-evidence
          npm view tscircuit@0.0.2646 version 2>&1 \
            | tee bootstrap-evidence/npm-registry.txt

      - name: Generate dependency lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only 2>&1 \
            | tee bootstrap-evidence/package-lock-generation.txt

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee bootstrap-evidence/npm-ci.txt

      - name: Record Bun version
        run: |
          set -euo pipefail
          bun --version 2>&1 | tee bootstrap-evidence/bun-version.txt

      - name: Record tscircuit CLI version
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsci --version 2>&1 \
            | tee bootstrap-evidence/tsci-version.txt

      - name: Record dependency tree and peer diagnostics
        run: |
          set -uo pipefail
          set +e
          npm ls --all --json \
            > bootstrap-evidence/dependency-tree.json \
            2> bootstrap-evidence/dependency-tree.stderr.txt
          npm_ls_exit_code=$?
          set -e
          printf '%s\n' "$npm_ls_exit_code" \
            | tee bootstrap-evidence/npm-ls-exit-code.txt
          # npm ls reports ELSPROBLEMS for the currently resolved peer graph.
          # Preserve that result as evidence without masking it or failing this
          # runtime-bootstrap checkpoint solely because of dependency metadata.
          exit 0

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-13-tscircuit-bootstrap
          path: |
            hardware/tscircuit/package-lock.json
            hardware/tscircuit/bootstrap-evidence/
          if-no-files-found: warn
