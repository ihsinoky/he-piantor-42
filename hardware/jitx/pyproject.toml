# pyproject.toml

[build-system]
requires = [
  "hatchling>=1.27.0,<2.0",
  "hatch-vcs>=0.4.0,<0.5.0"
]
build-backend = "hatchling.build"

[project]
name = "he_piantor_42_jitx"
version = "0.1"
dependencies = [
  "jitx==4.4.3",
  "jitxlib-standard>=4.4.0,<5"
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "ruff>=0.14.0,<1"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"he_piantor_42_jitx/**/*.py" = ["RUF012"] # JITX class-body members are structural declarations.
