<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HE Piantor 42 — Engineering dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><strong>HE Piantor 42</strong><span>Evidence-aware engineering dashboard</span></div><time id="updated"></time></header>
  <main>
    <section class="hero card">
      <div><p class="eyebrow" id="milestone"></p><h1 id="title"></h1><p id="summary"></p></div>
      <div class="state" id="runtime-state"></div>
    </section>
    <section class="grid">
      <article class="card"><h2>Pull request</h2><div id="pull-request"></div></article>
      <article class="card"><h2>Current work</h2><div id="runtime"></div></article>
      <article class="card wide"><h2>CI evidence</h2><div id="checks"></div></article>
      <article class="card"><h2>Gates</h2><div id="gates"></div></article>
      <article class="card"><h2>Tasks</h2><div id="tasks"></div></article>
    </section>
  </main>
  <script src="data/project-status.js"></script>
  <script src="data/runtime-status.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
