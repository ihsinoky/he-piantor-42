<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HE Piantor 42 — マイルストーン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header><p class="eyebrow">HE PIANTOR 42</p><h1>マイルストーンと現在位置</h1><p>設計から実測・完成・成果公開までの大局ビュー</p></header>
    <section class="current" aria-labelledby="current-title">
      <p id="position" class="eyebrow"></p><h2 id="current-title"></h2>
      <p id="next-gate"></p><p><a href="#milestones">計画を見る ↓</a></p>
    </section>
    <section aria-labelledby="plan-title">
      <div class="plan-heading"><h2 id="plan-title">マイルストーン計画</h2><span id="plan-status" class="note"></span></div>
      <p class="note">状態は完了／進行中／未着手。現在位置の枠は次に進む工程を示します。</p>
      <ol id="milestones" class="milestones"></ol>
    </section>
    <noscript><p>計画の表示にはJavaScriptが必要です。<a href="../docs/project-status.md">正本の計画</a>を参照してください。</p></noscript>
    <footer>
      <p>正本：<a id="status-source" href="../docs/project-status.md">project-status</a> · <a id="artifacts-source" href="../docs/artifacts-index.md">現行成果物索引</a></p>
      <p>詳細な状態・検証・残件は docs を参照。これは手動同期の read model です。PR Preview は提案中の内容で、承認を意味しません。</p>
      <p id="source-date"></p>
    </footer>
  </main>
  <script src="data/project-status.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
